name: Android 15 Authenticated APK and Supabase Test

on:
  workflow_dispatch:
  push:
    branches: [mobile-offline-v1]
    paths:
      - '.github/tests/android-authenticated-apk.cjs'
      - '.github/workflows/android-authenticated-apk.yml'

permissions:
  contents: read
  actions: read

jobs:
  authenticated-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download APK built with isolated test backend
        uses: actions/download-artifact@v4
        with:
          name: hive-offline-debug-apk
          repository: zhaoyu217/beekeepy
          run-id: 42453418933
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: candidate-apk
      - name: Install WebView CDP driver
        run: |
          test -s candidate-apk/app-debug.apk
          npm install --no-save --ignore-scripts chrome-remote-interface@0.33.3
          node --check .github/tests/android-authenticated-apk.cjs
          mkdir -p android-auth-results
          sha256sum candidate-apk/app-debug.apk > android-auth-results/apk-sha256.txt
      - name: Ensure KVM accessibility and preserve diagnostics metadata
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; ls -l /dev/kvm; else echo 'WARNING: /dev/kvm absent'; fi
          mkdir -p android-auth-results
          date -u > android-auth-results/runner-utc.txt
      - name: Run actual APK on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          heap-size: 512M
          disk-size: 6G
          disable-animations: true
          script: |
            set -eux
            mkdir -p android-auth-results
            trap 'rc=$?; echo "script_exit_code=$rc" > android-auth-results/script-exit.txt; timeout 15s adb logcat -b all -d -t 8000 > android-auth-results/logcat-on-exit.txt 2>&1 || true; timeout 15s adb shell df -h > android-auth-results/disk-on-exit.txt 2>&1 || true; timeout 15s adb shell dumpsys meminfo > android-auth-results/meminfo-on-exit.txt 2>&1 || true; exit "$rc"' EXIT
            timeout 120s adb wait-for-device
            adb devices -l | tee android-auth-results/adb-devices-before-install.txt
            test "$(adb get-state)" = "device"
            test "$(timeout 30s adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
            ls -lh candidate-apk/app-debug.apk | tee android-auth-results/apk-size.txt
            timeout 20s adb shell df -h /data > android-auth-results/data-partition.txt 2>&1 || true
            timeout 20s adb shell cat /proc/meminfo > android-auth-results/device-meminfo.txt 2>&1 || true
            timeout 20s adb shell service check package > android-auth-results/package-service.txt 2>&1 || true
            set +e
            PACKAGE_READY=0
            for i in $(seq 1 8); do
              timeout 15s adb shell cmd package list packages > android-auth-results/package-list-check.txt 2>&1
              if [ "$?" -eq 0 ]; then PACKAGE_READY=1; break; fi
              sleep 5
            done
            set -e
            echo "package_manager_ready=$PACKAGE_READY" | tee android-auth-results/package-manager-ready.txt
            test "$PACKAGE_READY" -eq 1
            timeout 180s adb install -r candidate-apk/app-debug.apk
            timeout 30s adb shell pm path app.hivefield.mobile.fix | tee android-auth-results/installed-package-path.txt
            adb logcat -c
            adb logcat -v threadtime > android-auth-results/logcat-live.txt 2>&1 &
            LOGCAT_PID=$!
            set +e
            timeout 20s adb shell am start -n app.hivefield.mobile.fix/app.hivefield.mobile.MainActivity
            START_RC=$?
            set -e
            echo "am_start_exit_code=$START_RC" | tee android-auth-results/launch-status.txt
            sleep 25
            set +e
            timeout 20s adb get-state > android-auth-results/adb-state-after-launch.txt 2>&1
            STATE_RC=$?
            timeout 20s adb shell pidof app.hivefield.mobile.fix > android-auth-results/app-pid.txt 2>&1
            PID_RC=$?
            set -e
            echo "adb_state_exit_code=$STATE_RC" >> android-auth-results/launch-status.txt
            echo "app_pid_exit_code=$PID_RC" >> android-auth-results/launch-status.txt
            kill "$LOGCAT_PID" 2>/dev/null || true
            wait "$LOGCAT_PID" 2>/dev/null || true
            cat android-auth-results/launch-status.txt
            cat android-auth-results/app-pid.txt || true
            test "$STATE_RC" -eq 0
            test "$PID_RC" -eq 0
            node .github/tests/android-authenticated-apk.cjs
      - name: Save Android diagnostics
        if: always()
        run: |
          mkdir -p android-auth-results
          timeout 10s adb devices -l > android-auth-results/adb-devices.txt 2>&1 || true
          timeout 12s adb logcat -b all -d -t 8000 > android-auth-results/logcat-after.txt 2>&1 || true
      - name: Upload Android authenticated test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android15-authenticated-apk-report
          path: android-auth-results/
          retention-days: 7
          if-no-files-found: warn
