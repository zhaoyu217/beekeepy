name: Android 15 Authenticated APK and Supabase Test

on:
  workflow_dispatch:
  push:
    branches: [mobile-offline-v1]
    paths:
      - '.github/tests/android-authenticated-apk.cjs'
      - '.github/workflows/android-authenticated-apk.yml'

permissions:
  contents: read
  actions: read

jobs:
  authenticated-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download APK built with isolated test backend
        uses: actions/download-artifact@v4
        with:
          name: hive-offline-debug-apk
          repository: zhaoyu217/beekeepy
          run-id: 42453418933
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: candidate-apk
      - name: Install WebView CDP driver
        run: |
          test -s candidate-apk/app-debug.apk
          npm install --no-save --ignore-scripts chrome-remote-interface@0.33.3
          node --check .github/tests/android-authenticated-apk.cjs
          mkdir -p android-auth-results
          sha256sum candidate-apk/app-debug.apk > android-auth-results/apk-sha256.txt
      - name: Run actual APK on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          heap-size: 512M
          disk-size: 4G
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          disable-spellchecker: true
          script: |
            set -eux
            mkdir -p android-auth-results
            timeout 120s adb wait-for-device
            adb devices -l
            test "$(adb get-state)" = "device"
            test "$(timeout 30s adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
            ls -lh candidate-apk/app-debug.apk
            timeout 600s adb install --no-streaming -r candidate-apk/app-debug.apk
            timeout 30s adb shell pm path app.hivefield.mobile.fix
            adb logcat -c
            adb logcat -v threadtime > android-auth-results/logcat-live.txt 2>&1 &
            LOGCAT_PID=$!
            set +e
            timeout 20s adb shell am start -n app.hivefield.mobile.fix/app.hivefield.mobile.MainActivity
            START_RC=$?
            set -e
            echo "am_start_exit_code=$START_RC" | tee android-auth-results/launch-status.txt
            sleep 25
            set +e
            timeout 20s adb get-state > android-auth-results/adb-state-after-launch.txt 2>&1
            STATE_RC=$?
            timeout 20s adb shell pidof app.hivefield.mobile.fix > android-auth-results/app-pid.txt 2>&1
            PID_RC=$?
            set -e
            echo "adb_state_exit_code=$STATE_RC" >> android-auth-results/launch-status.txt
            echo "app_pid_exit_code=$PID_RC" >> android-auth-results/launch-status.txt
            kill "$LOGCAT_PID" 2>/dev/null || true
            wait "$LOGCAT_PID" 2>/dev/null || true
            cat android-auth-results/launch-status.txt
            cat android-auth-results/app-pid.txt || true
            test "$STATE_RC" -eq 0
            test "$PID_RC" -eq 0
            node .github/tests/android-authenticated-apk.cjs
      - name: Save Android diagnostics
        if: always()
        run: |
          mkdir -p android-auth-results
          timeout 10s adb devices -l > android-auth-results/adb-devices.txt 2>&1 || true
          timeout 12s adb logcat -d -t 4000 > android-auth-results/logcat-after.txt 2>&1 || true
      - name: Upload Android authenticated test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android15-authenticated-apk-report
          path: android-auth-results/
          retention-days: 7
          if-no-files-found: warn
