name: Build Android Touch QA APK

on:
  workflow_dispatch:
  push:
    branches: [mobile-offline-v1]
    paths:
      - '.github/workflows/android-touch-qa.yml'


permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout mobile branch
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor dependencies
        run: npm install

      - name: Prepare bundled web application
        run: npm run mobile:prepare
        env:
          HIVE_TOUCH_DIAGNOSTICS: '1'


      - name: Guard Android UI script loading and syntax
        shell: bash
        run: |
          set -euxo pipefail
          node --check mobile/dist/app.js
          node --check mobile/dist/v45.js
          node --check mobile/dist/mobile-android-runtime-fixes.js
          node --check mobile/dist/mobile-five-gaps.js
          node --check mobile/dist/mobile-touch-diagnostic.js
          grep -q 'mobile-touch-diagnostic.js' mobile/dist/index.html
          node --check mobile/dist/mobile-native-voice-shim.js
          node <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const original=fs.readFileSync('v45.js','utf8');
          const mobile=fs.readFileSync('mobile/dist/v45.js','utf8');
          const html=fs.readFileSync('mobile/dist/index.html','utf8');
          assert(original.includes('function vSaveInspection(id){const s=v45s(),h=hive(s,id);'));
          assert(mobile.includes('function v77RetiredSaveInspection(id){const s=v45s(),h=hive(s,id);'));
          assert(mobile.includes('function vSaveInspection(id){\n  const s=v45s()'));
          assert.equal((mobile.match(/function vSaveInspection\(id\)\{/g)||[]).length,1);
          assert.equal(mobile.length,original.length+('v77RetiredSaveInspection'.length-'vSaveInspection'.length));
          assert(mobile.includes('Choose the hive before starting this record.'));
          assert(mobile.includes('window.v2p2e5lHomeQuick=function(kind)'));
          assert(mobile.includes('window.v2p2e5lStartHomeQuick=startHomeQuick'));
          assert(html.includes('mobile-android-runtime-fixes.js'));
          assert(html.includes('mobile-native-voice-shim.js'));
          assert(html.includes('mobile-five-gaps.js'));
          console.log('UI source and native-bundle-only collision fix: PASS');
          const localScripts=[...html.matchAll(/<script\s+src=["']([^"']+)["']/g)]
            .map(x=>x[1].split('?')[0]).filter(x=>!/^https?:/.test(x)&&x!=='vendor/supabase.min.js');
          const missing=localScripts.filter(x=>!fs.existsSync('mobile/dist/'+x));
          console.log('Android packaged HTML missing local scripts:',missing);
          assert.deepEqual(missing,[], 'Every Android local script must actually exist');
          const webIndex=fs.readFileSync('index.html','utf8');
          for(const n of ['r08a1.js','r10a5-observability.js']){
            assert(webIndex.includes(n),'Original web index source must be preserved');
            assert(!html.includes(n),'Missing historical scripts must not load in Android');
          }
          NODE

      - name: Verify Android safe-area bundle
        shell: bash
        run: |
          set -euxo pipefail
          node --check mobile/scripts/prepare-web.mjs
          node --check mobile/scripts/configure-android.mjs
          test -s mobile/dist/mobile-system-safe-area.css
          grep -q 'mobile-system-safe-area.css' mobile/dist/index.html
          grep -q 'env(safe-area-inset-top' mobile/dist/mobile-system-safe-area.css
          grep -q 'env(safe-area-inset-bottom' mobile/dist/mobile-system-safe-area.css
          grep -q 'padding-bottom:var(--hd-android-safe-bottom)' mobile/dist/mobile-system-safe-area.css
          grep -q 'height:calc(70px + var(--hd-android-safe-bottom))' mobile/dist/mobile-system-safe-area.css
          node <<'NODE'
          const fs = require('fs'), assert = require('assert/strict');
          const index = fs.readFileSync('mobile/dist/index.html','utf8');
          const theme = index.indexOf('ui-final-polish.css');
          const safe = index.indexOf('mobile-system-safe-area.css');
          assert(theme >= 0 && safe > theme, 'APK-only override must load after frozen visual styles');
          assert(index.includes('viewport-fit=cover'),'native safe-area mapping requires viewport-fit=cover');
          console.log('APK-safe-area stylesheet order and viewport: PASS');
          NODE

      - name: Bundle Supabase runtime for offline cold start
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p mobile/dist/vendor
          curl --fail --location --retry 4 --retry-delay 2 \
            -o mobile/dist/vendor/supabase.min.js \
            https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js
          test "$(stat -c%s mobile/dist/vendor/supabase.min.js)" -gt 100000
          grep -q "createClient" mobile/dist/vendor/supabase.min.js
          grep -q 'vendor/supabase.min.js' mobile/dist/index.html
          ! grep -q 'cdn.jsdelivr.net/npm/@supabase/supabase-js@2' mobile/dist/index.html
          ! grep -q 'unpkg.com/@supabase/supabase-js@2' mobile/dist/index.html

      - name: Generate Capacitor Android project
        run: npx cap add android

      - name: Download sherpa-onnx Android AAR
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p android/app/libs
          curl --fail --location --retry 4 --retry-delay 2             -o android/app/libs/sherpa-onnx-1.13.8.aar             https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
          echo "633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96  android/app/libs/sherpa-onnx-1.13.8.aar" | sha256sum -c -

      - name: Bundle English offline streaming model
        shell: bash
        run: |
          set -euxo pipefail
          MODEL_DIR="android/app/src/main/assets/sherpa-onnx-streaming-zipformer-en-2023-06-26"
          BASE="https://huggingface.co/csukuangfj/sherpa-onnx-streaming-zipformer-en-2023-06-26/resolve/main"
          mkdir -p "$MODEL_DIR"
          curl --fail --location --retry 4 --retry-delay 2 -o "$MODEL_DIR/encoder-epoch-99-avg-1-chunk-16-left-128.int8.onnx" "$BASE/encoder-epoch-99-avg-1-chunk-16-left-128.int8.onnx"
          curl --fail --location --retry 4 --retry-delay 2 -o "$MODEL_DIR/decoder-epoch-99-avg-1-chunk-16-left-128.onnx" "$BASE/decoder-epoch-99-avg-1-chunk-16-left-128.onnx"
          curl --fail --location --retry 4 --retry-delay 2 -o "$MODEL_DIR/joiner-epoch-99-avg-1-chunk-16-left-128.onnx" "$BASE/joiner-epoch-99-avg-1-chunk-16-left-128.onnx"
          curl --fail --location --retry 4 --retry-delay 2 -o "$MODEL_DIR/tokens.txt" "$BASE/tokens.txt"
          curl --fail --location --retry 4 --retry-delay 2 -o "$MODEL_DIR/bpe.model" "$BASE/bpe.model"
          python -m pip install --disable-pip-version-check --quiet sentencepiece==0.2.1
          MODEL_DIR="$MODEL_DIR" python - <<'PY'
          import os
          import sentencepiece as spm
          from pathlib import Path
          model_dir = Path(os.environ["MODEL_DIR"])
          sp = spm.SentencePieceProcessor(model_file=str(model_dir / "bpe.model"))
          with (model_dir / "bpe.vocab").open("w", encoding="utf-8") as f:
              for i in range(sp.get_piece_size()):
                  f.write(f"{sp.id_to_piece(i)}\t{sp.get_score(i)}\n")
          PY
          test "$(stat -c%s "$MODEL_DIR/encoder-epoch-99-avg-1-chunk-16-left-128.int8.onnx")" -gt 70000000
          test "$(stat -c%s "$MODEL_DIR/decoder-epoch-99-avg-1-chunk-16-left-128.onnx")" -gt 2000000
          test "$(stat -c%s "$MODEL_DIR/joiner-epoch-99-avg-1-chunk-16-left-128.onnx")" -gt 1000000
          test -s "$MODEL_DIR/tokens.txt"
          test -s "$MODEL_DIR/bpe.vocab"
          grep -q "QUEEN" "$MODEL_DIR/bpe.vocab" || true

      - name: Configure Android native OfflineAsr plugin
        run: node mobile/scripts/configure-android.mjs

      - name: Label diagnostic build without changing Android package data
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='android/app/src/main/res/values/strings.xml';
          let t=fs.readFileSync(p,'utf8');
          if(!t.includes('Hive FIX'))throw Error('Expected Hive FIX label');
          t=t.replaceAll('Hive FIX','Hive TOUCH QA');
          fs.writeFileSync(p,t);
          const gradle='android/app/build.gradle';
          let g=fs.readFileSync(gradle,'utf8');
          if(!g.includes('applicationIdSuffix ".fix"'))throw Error('Expected debug suffix .fix');
          // Separate package avoids changing any user's installed Hive FIX or local data.
          g=g.replace('applicationIdSuffix ".fix"','applicationIdSuffix ".touchqa"');
          fs.writeFileSync(gradle,g);
          NODE

      - name: Verify packaged inputs
        shell: bash
        run: |
          set -euxo pipefail
          test -f android/app/src/main/java/app/hivefield/mobile/OfflineAsrPlugin.kt
          grep -q "registerPlugin(OfflineAsrPlugin.class)" android/app/src/main/java/app/hivefield/mobile/MainActivity.java
          grep -q 'EdgeToEdge.enable(this)' android/app/src/main/java/app/hivefield/mobile/MainActivity.java
          grep -q "android.permission.RECORD_AUDIO" android/app/src/main/AndroidManifest.xml
          test -f android/app/libs/sherpa-onnx-1.13.8.aar
          test -s android/app/src/main/assets/sherpa-onnx-streaming-zipformer-en-2023-06-26/bpe.vocab
          grep -q "mobile-native-voice-shim.js" mobile/dist/index.html
          grep -q "mobile-five-gaps.js" mobile/dist/index.html
          grep -q "vendor/supabase.min.js" mobile/dist/index.html
          test -f mobile/dist/vendor/supabase.min.js

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: hive-touch-diagnostic-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
