name: Android UI Browser Smoke

on:
  workflow_dispatch:
  push:
    branches: [mobile-offline-v1]
    paths:
      - '.github/tests/android-web-smoke.cjs'
      - 'mobile/android-runtime-fixes.js'
      - '.github/workflows/android-ui-browser-smoke.yml'

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit missing legacy script history
        shell: bash
        run: |
          echo 'AUDIT missing references and history'
          for file in r08a1.js r10a5-observability.js; do
            echo "FILE $file"
            if test -f "$file"; then echo PRESENT; else echo MISSING; fi
            git log --all --format='%h %s' -- "$file" | head -8
          done
          echo 'INDEX REFERENCES'
          grep -nE 'r08a1.js|r10a5-observability.js' index.html
      - name: Audit R08A1 and R10A5 missing-source dependencies
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const matches=[],missing=['r08a1.js','r10a5-observability.js'];
          function visit(dir){
            for(const item of fs.readdirSync(dir,{withFileTypes:true})){
              if(['.git','node_modules','mobile','smoke-results'].includes(item.name))continue;
              const p=path.join(dir,item.name);
              if(item.isDirectory())visit(p);
              else if(/\.(js|html)$/.test(item.name)){
                const rows=fs.readFileSync(p,'utf8').split('\n');
                for(let i=0;i<rows.length;i++)if(/r08a1|r10a5/i.test(rows[i]))
                  matches.push({file:p,line:i+1,fragment:rows[i].slice(0,250)});
              }
            }
          }
          visit('.');
          console.log('MISSING_SCIENCE_FILE_AUDIT '+JSON.stringify({
            missing:missing.map(f=>({name:f,exists:fs.existsSync(f)})),
            references:matches,nonIndexReferences:matches.filter(x=>x.file!=='index.html')
          }));
          NODE
      - name: Prepare real Android WebView HTML bundle
        run: |
          node mobile/scripts/prepare-web.mjs
          node --check mobile/dist/v45.js
      - name: Install headless browser
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run click, modal, routing and safe-area smoke tests
        run: node .github/tests/android-web-smoke.cjs
      - name: Upload diagnostic report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-smoke-report
          path: smoke-results/
          retention-days: 7
          if-no-files-found: warn
