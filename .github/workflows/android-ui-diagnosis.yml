name: Android UI source diagnosis

on:
  push:
    branches: [mobile-offline-v1]
    paths:
      - '.github/workflows/android-ui-diagnosis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          for file in app.js v45.js inspection-voice.js mobile/five-gaps.js mobile/android-runtime-fixes.js mobile/native-voice-shim.js; do
            echo "CHECK $file"
            node --check "$file" || echo "SYNTAX_FAILURE $file"
          done
      - name: Extract UI handler source around exact screenshot strings
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          for (const f of ['v45.js', 'app.js', 'mobile/android-runtime-fixes.js']) {
            const code = fs.readFileSync(f, 'utf8');
            if (f === 'v45.js') {
              const rx = /\\b(?:const|let|var|function|async\\s+function)\\s+vSaveInspection\\b/g;
              for (const m of code.matchAll(rx)) {
                const line = code.slice(0,m.index).split('\\n').length;
                console.log('DECLARATION vSaveInspection line', line, 'index', m.index);
                console.log(code.slice(Math.max(0,m.index-450), m.index+850));
              }
            }
            console.log('\nSOURCE', f, 'length', code.length);
            const terms = ['vSaveInspection', 'Choose the hive before starting this record.', 'Select Hive', 'v2p2e5lHomeQuick', 'v2p2e5lStartHomeQuick', 'v2p2e5l-quick-hive', 'v215-more-modal'];
            for (const t of terms) {
              let i = code.indexOf(t), n = 0;
              console.log('TERM', JSON.stringify(t), 'index', i);
              while (i !== -1 && n++ < 2) {
                console.log('---- BEGIN', t, 'match', n);
                console.log(code.slice(Math.max(0, i - 1150), Math.min(code.length, i + 1700)));
                console.log('---- END');
                i = code.indexOf(t, i + t.length);
              }
            }
          }
          NODE
