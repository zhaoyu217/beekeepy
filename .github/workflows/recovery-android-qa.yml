name: Beekeepy Recovery QA — source/build gate (not for installation)
on:
  push:
    branches:
      - recovery/beekeepy-20261123-qa
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-attempt-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check reconstructable source prerequisites before builds
        run: |
          set -euo pipefail
          node --version
          for f in android/app/build.gradle android/settings.gradle android/app/src/main/AndroidManifest.xml android/app/src/main/java/app/hivefield/mobile/MainActivity.java commercial/client/verified-account.mjs mobile/scripts/prepare-recovery-web.mjs; do test -s "$f" || { echo "BLOCKED missing: $f"; exit 1; }; done
          node --check commercial/client/verified-account.mjs
          node --check mobile/scripts/prepare-recovery-web.mjs
          node --check mobile/commercial-account-bootstrap.mjs
          test -s android/app/src/main/java/app/hivefield/mobile/OfflineAsrPlugin.kt || { echo 'BLOCKED native OfflineAsrPlugin.kt not uploaded'; exit 1; }
          test -s android/app/src/main/java/app/hivefield/mobile/DeviceFilesPlugin.kt || { echo 'BLOCKED native DeviceFilesPlugin.kt not uploaded'; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Provision Capacitor and prepare QA WebView bundle
        run: |
          npm install --no-audit --no-fund --save-exact @capacitor/core@8.0.0 @capacitor/android@8.0.0 @capacitor/cli@8.0.0 typescript@5.9.0
          node mobile/scripts/prepare-recovery-web.mjs
      - name: Android pinned dependencies gate (must fail closed if unavailable)
        run: node android/qa/preflight.mjs
      - name: Assemble isolated debug QA APK (no release or installation)
        run: gradle -p android :app:assembleDebug --stacktrace
      - name: APK SHA256
        run: sha256sum android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: beekeepy-recovery-qa-debug-not-for-installation
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
