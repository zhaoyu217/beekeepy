name: Beekeepy Recovery QA (never release/install)
on:
  workflow_dispatch:
  push:
    branches:
      - recovery/beekeepy-20261123-qa
permissions:
  contents: read
jobs:
  debug-only:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify hosted Android SDK
        run: test -d "$ANDROID_HOME"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Install pinned Capacitor 8 packages
        run: npm install --no-audit --no-fund --save-exact @capacitor/core@8.0.0 @capacitor/android@8.0.0 @capacitor/cli@8.0.0 @capacitor/ios@8.0.0 typescript@5.9.0
      - name: Repackage original web assets plus isolated commercial bridge
        run: node mobile/scripts/prepare-recovery-web.mjs
      - name: Bundle pinned Supabase UMD (build input, needs future cryptographic lock)
        run: |
          set -euo pipefail
          mkdir -p mobile/dist/vendor android/app/src/main/assets/public/vendor
          curl --fail --location --retry 3 -o mobile/dist/vendor/supabase.min.js https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js
          test "$(stat -c%s mobile/dist/vendor/supabase.min.js)" -gt 100000
          grep -q createClient mobile/dist/vendor/supabase.min.js
          cp mobile/dist/vendor/supabase.min.js android/app/src/main/assets/public/vendor/supabase.min.js
          sha256sum mobile/dist/vendor/supabase.min.js > android/qa/supabase-qa-build.sha256
      - name: Download and SHA256-check pinned offline ASR resources
        run: node android/qa/fetch-pinned-models.mjs
      - name: Generate deterministic SentencePiece vocabulary
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check sentencepiece==0.2.1
          python - <<'PY'
          from pathlib import Path
          import sentencepiece as spm
          base=Path('android/app/src/main/assets/sherpa-onnx-streaming-zipformer-en-2023-06-26')
          sp=spm.SentencePieceProcessor(model_file=str(base/'bpe.model'))
          with (base/'bpe.vocab').open('w',encoding='utf-8') as f:
            for i in range(sp.get_piece_size()):
              f.write(f'{sp.id_to_piece(i)}\t{sp.get_score(i)}\n')
          PY
      - name: Sync Capacitor Android native framework
        run: npx cap sync android
      - name: Ensure hotwords included after sync
        run: cp mobile/dist/mobile-hotwords.txt android/app/src/main/assets/public/mobile-hotwords.txt
      - name: Recovery-only JavaScript and source gate
        run: |
          node --test commercial/tests/*.test.mjs tools/data-preservation-v2/tests/*.test.mjs android/qa/source.test.mjs
          node android/qa/preflight.mjs
      - name: Build isolated QA-only APK
        run: gradle -p android :app:assembleDebug --stacktrace
      - name: APK identity and checksum (no installation)
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: beekeepy-recovery-qa-debug-not-for-installation
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
