  body{background:var(--shell);font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
  #app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;overflow-x:hidden}
  svg{display:block}
  button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none;margin:0;padding:0;text-align:left}
  .scr{display:flex;flex-direction:column;min-height:100vh;animation:f .2s ease}
  @keyframes f{from{opacity:0}to{opacity:1}}
  .body{flex:1;padding:4px 18px 96px}
  .body.flow{padding-bottom:30px}

  .statusbar{display:flex;justify-content:space-between;align-items:center;padding:9px 22px 2px;color:#9AA096;font-size:12px;font-weight:600}
  .statusbar .r{display:flex;gap:6px}

  .home-top{display:flex;align-items:center;justify-content:space-between;padding:8px 18px 10px}
  .logo{font-size:22px;font-weight:800;letter-spacing:-.02em;color:var(--text)}
  .ib{width:42px;height:42px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--green);transition:background .15s}
  .ib:active{background:var(--soft)}
  .ib.dot{position:relative}
  .ib.dot::after{content:"";position:absolute;top:7px;right:9px;width:9px;height:9px;border-radius:999px;background:#E0533F;border:2px solid var(--bg)}
  .topbar{display:grid;grid-template-columns:46px 1fr 46px;align-items:center;padding:10px 8px 8px}
  .topbar .ttl{text-align:center;font-size:17px;font-weight:700}
  .topbar .right{display:flex;justify-content:flex-end;align-items:center;gap:2px}
  .topbar .right .ib{width:38px;height:38px}

  .hero{position:relative;border-radius:var(--r);overflow:hidden;background:linear-gradient(150deg,var(--hero1),var(--hero2));padding:16px 18px;color:#fff;min-height:104px;display:flex;align-items:center}
  .hero .info{position:relative;z-index:2}
  .hero .kick{font-size:11px;color:#DCE6D2;font-weight:700;letter-spacing:.06em}
  .hero .nm{font-size:25px;font-weight:800;margin-top:3px;display:flex;align-items:center;gap:7px}
  .hero .sub{font-size:13px;color:#E5EDDD;margin-top:2px}
  .hero .art{position:absolute;right:6px;bottom:-2px;width:128px;height:108px;z-index:1;opacity:.96}
  .hero .hero-photo{position:absolute;right:0;top:0;height:100%;width:48%;object-fit:cover;object-position:50% 50%;z-index:1;-webkit-mask-image:linear-gradient(90deg,transparent,#000 44%);mask-image:linear-gradient(90deg,transparent,#000 44%)}
  .hero .chev{display:inline-flex;width:24px;height:24px;border-radius:999px;background:rgba(255,255,255,.22);align-items:center;justify-content:center}

  .gbtn{width:100%;background:var(--gold);color:#fff;border-radius:var(--r);padding:15px;display:flex;align-items:center;justify-content:center;gap:9px;font-size:16px;font-weight:700;transition:filter .15s}
  .gbtn:active{filter:brightness(.94)}
  .obtn{width:100%;background:var(--card);border:1.5px solid var(--line);color:var(--green-deep);border-radius:var(--r);padding:14px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:700}

  .grid4{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .qcard{background:#ECECEC;border:1px solid #E0E0E0;border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:9px;box-shadow:0 1px 3px rgba(40,50,30,.04);transition:transform .1s}
  .qcard:active{transform:scale(.98)}
  .qcard .qi{width:42px;height:42px;border-radius:16px;background:var(--green-tint);color:var(--green);display:flex;align-items:center;justify-content:center}
  .qcard .qt{font-size:14px;font-weight:700}
  .qcard .qe{font-size:11px;color:var(--muted);margin-top:-4px}

  .sec{display:flex;align-items:center;margin:20px 2px 11px}
  .sec .h{font-size:16px;font-weight:800}
  .sec .lk{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:1px}

  .list{display:flex;flex-direction:column;gap:10px}
  .item{width:100%;display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;box-shadow:0 1px 3px rgba(40,50,30,.04);transition:background .15s}
  .item:active{background:var(--soft)}
  .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .item .t{flex:1;font-size:15px;font-weight:700}
  .item .s{font-size:13px;color:var(--muted)}
  .tag{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
  .tag.ok{background:var(--green-tint);color:var(--green-tx)}
  .tag.mid{background:var(--amber-tint);color:var(--amber-tx)}
  .tag.bad{background:var(--red-tint);color:var(--red-tx)}

  .rec{width:100%;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;box-shadow:0 1px 3px rgba(40,50,30,.04)}
  .rec .ri{width:46px;height:46px;background:transparent;display:flex;align-items:center;justify-content:center;flex:none}

  .search{display:flex;align-items:center;gap:9px;background:var(--soft);border-radius:var(--r);padding:11px 14px;color:var(--muted);font-size:14px;margin:2px 0 14px}
  .hive-ico{width:40px;height:40px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:none;position:relative}
  .hive-ico img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
  .hive-ico .cam{position:absolute;right:-4px;bottom:-4px;width:18px;height:18px;border-radius:999px;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}

  .health{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:0 1px 3px rgba(40,50,30,.04)}
  .ring{position:relative;width:74px;height:74px;flex:none}
  .ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .nm{font-size:21px;font-weight:800;line-height:1;color:var(--green)}
  .ring .u{font-size:10px;color:var(--muted)}
  .inforow{display:flex;align-items:center;padding:14px 2px;border-bottom:1px solid var(--line);font-size:15px}
  .inforow:last-child{border-bottom:none}
  .inforow .k{color:var(--muted);flex:1}
  .inforow .v{font-weight:700}

  .stepper{display:flex;align-items:center;padding:6px 4px 2px;margin:2px 0 22px}
  .stepper .node{width:13px;height:13px;border-radius:50%;background:#D9DCCF;flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
  .stepper .node.on{background:var(--green)}
  .stepper .seg{flex:1;height:3px;background:#D9DCCF;margin:0 2px;border-radius:2px}
  .stepper .seg.on{background:var(--green)}
  .wz-title{text-align:center;font-size:21px;font-weight:800;margin-top:6px}
  .wz-q{text-align:center;font-size:14px;color:var(--muted);margin:6px 0 22px}
  .optcard{width:100%;display:flex;align-items:center;gap:14px;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:13px;transition:transform .08s}
  .optcard:active{transform:scale(.99)}
  .optcard.on{border-color:var(--green);background:var(--green-tint)}
  .radio{width:26px;height:26px;border-radius:50%;border:2px solid #CDD1C5;flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
  .optcard.on .radio{background:var(--green);border-color:var(--green)}
  .ol{flex:1;font-size:16px;font-weight:700}
  .oi{color:var(--gold)}
  .wz-actions{display:flex;gap:12px;margin-top:8px}
  .wz-skip{flex:none;padding:0 26px;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);font-size:16px;font-weight:700;color:var(--text);display:flex;align-items:center;justify-content:center}
  .wz-next{flex:1;background:var(--gold);color:#fff;border-radius:var(--r);padding:16px;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
  .ta{width:100%;min-height:96px;background:var(--soft);border:1px solid var(--line);border-radius:var(--r);padding:13px;font-size:14px;color:var(--text);resize:none;font-family:inherit}
  .photo-add{display:flex;gap:10px;margin-top:12px}
  .pbtn{flex:1;background:var(--soft);border:1px dashed #C7CABA;border-radius:var(--r);padding:16px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--green-deep);font-size:13px;font-weight:700}

  .rhero{position:relative;border-radius:var(--r);background:linear-gradient(150deg,var(--hero1),var(--hero2));color:#fff;padding:15px 17px;display:flex;align-items:center;justify-content:space-between}
  .rhero .rt{font-size:18px;font-weight:800}
  .rhero .rs{font-size:13px;color:#E5EDDD;margin-top:3px}
  .field{display:flex;align-items:center;gap:13px;padding:14px 2px;border-bottom:1px solid var(--line)}
  .field .fi{width:30px;color:var(--green);display:flex;justify-content:center;flex:none}
  .field .fk{flex:1;font-size:15px}
  .field .fv{font-size:15px;font-weight:700}
  .blk-title{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:800;margin:18px 2px 9px}
  .blk-title .bi{color:var(--green)}
  .note-txt{background:var(--soft);border-radius:var(--r);padding:14px;font-size:14px;line-height:1.7;color:#3A453A}
  .photos{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
  .photos .ph{aspect-ratio:1;border-radius:16px;background:
     radial-gradient(circle at 30% 30%, #E7C25A 0 18%, transparent 19%),
     radial-gradient(circle at 70% 60%, #D8A23F 0 16%, transparent 17%),
     radial-gradient(circle at 50% 80%, #C68A2E 0 14%, transparent 15%),
     linear-gradient(135deg,#D9AE4C,#B57E2C)}
  .audio{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:var(--r);padding:11px 14px}
  .audio .play{width:38px;height:38px;border-radius:999px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
  .audio .wf{flex:1;display:flex;align-items:center;gap:2.5px;height:26px}
  .audio .wf i{flex:1;border-radius:3px;background:#C7CBBC}
  .audio .wf i.a{background:var(--green)}
  .audio .tm{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

  .tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--card);border-top:1px solid var(--line);display:flex;padding:7px 6px calc(7px + env(safe-area-inset-bottom));z-index:40}
  .tabbar .tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11px;font-weight:600;padding:5px 0}
  .tabbar .tb.on{color:var(--green)}

  .more-row{width:100%;display:flex;align-items:center;gap:13px;padding:15px 16px;background:var(--card);border-bottom:1px solid var(--line)}
  .more-row:last-child{border-bottom:none}
  .more-wrap{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:0 1px 3px rgba(40,50,30,.04);background:var(--card)}

  .pro-banner{width:100%;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:var(--r);padding:15px 17px;display:flex;align-items:center;gap:12px;margin-bottom:6px;box-shadow:0 1px 3px rgba(40,50,30,.04)}
  .pro-banner .pt{flex:1}
  .pro-banner .pa{font-size:16px;font-weight:800;color:var(--green-deep)}
  .pro-banner .pb{font-size:12px;color:var(--muted);margin-top:2px}
  .pro-banner .pgo{background:var(--gold);color:#fff;font-size:13px;font-weight:800;padding:9px 14px;border-radius:999px;white-space:nowrap}
  .grp-label{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:18px 4px 9px}
  .mr-ic{width:34px;height:34px;border-radius:16px;background:var(--green-tint);color:var(--green);display:flex;align-items:center;justify-content:center;flex:none}
  .mr-t{font-size:15px;font-weight:700}
  .mr-d{font-size:12px;color:var(--muted);margin-top:1px}
  .segtabs{display:flex;gap:18px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:14px}
  .segtab{font-size:14px;color:var(--muted);padding:10px 0;font-weight:700;border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
  .segtab.on{color:var(--green);border-color:var(--green)}
  .ddchip{display:inline-flex;align-items:center;gap:4px;background:var(--soft);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--text)}
  .statgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:6px}
  .statcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:0 1px 3px rgba(40,50,30,.04)}
  .statcard .sl{font-size:12px;color:var(--muted)}
  .statcard .sv{font-size:26px;font-weight:800;margin:3px 0}
  .statcard .sd{font-size:11px;font-weight:700}
  .up{color:var(--green)} .down{color:var(--red-tx)}
  .bignum{font-size:34px;font-weight:800;text-align:center;margin:2px 0 4px;color:var(--text)}
  .lrow{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;margin-bottom:10px;box-shadow:0 1px 3px rgba(40,50,30,.04)}
  .lrow .li{width:42px;height:42px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:none}
  .lrow .lt{font-size:15px;font-weight:700}
  .lrow .ls{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.5}
  .lrow .lv{font-size:14px;font-weight:700;color:var(--muted)}
  .add-btn{width:100%;background:var(--gold);color:#fff;border-radius:var(--r);padding:15px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:700;margin-top:4px}
  .add-soft{background:var(--gold);color:#fff}
  .ap-open{display:flex;align-items:center;gap:13px;flex:1;min-width:0;background:none}
  .trash{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--red-tx);flex:none}
  .trash:active{background:var(--red-tint)}
  .efield{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
  .efield .fi{width:24px;color:var(--green);display:flex;justify-content:center;flex:none}
  .efield .fk{width:70px;flex:none;color:var(--muted);font-size:14px}
  .einp{flex:1;background:var(--soft);border:none;border-radius:10px;padding:9px 12px;font-size:15px;font-weight:600;color:var(--text);font-family:inherit;outline:none;min-width:0;width:100%}
  .hivecard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;margin-bottom:12px;box-shadow:0 1px 3px rgba(40,50,30,.04)}
  .hivecard .htop{display:flex;align-items:center;gap:12px}
  .hivecard .hrow{display:flex;align-items:center;gap:10px;margin-top:11px}
  .hivecard .hlab{font-size:13px;font-weight:600;color:var(--muted);width:60px;flex:none}
  .hv-select{flex:1;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;font-weight:600;color:var(--text);font-family:inherit;outline:none;width:100%}
  .einp:focus{box-shadow:0 0 0 2px var(--green-tint)}
  .gps{width:38px;height:38px;border-radius:10px;background:var(--green-tint);color:var(--green);display:flex;align-items:center;justify-content:center;flex:none}
  .gps:active{filter:brightness(.95)}
  .thumb{width:52px;height:52px;border-radius:16px;flex:none;background:linear-gradient(165deg,#AEC2D6 0 36%,#7E9A66 37%,#5E7350)}
  .toggle{width:46px;height:28px;border-radius:999px;background:var(--green);position:relative;flex:none}
  .toggle.off{background:#CDD0C4}
  .toggle::after{content:"";position:absolute;top:3px;left:21px;width:22px;height:22px;border-radius:999px;background:#fff}
  .toggle.off::after{left:3px}
  .feat{display:flex;align-items:center;gap:11px;padding:12px 2px;font-size:15px;border-bottom:1px solid var(--line)}
  .feat .fc{color:var(--green);flex:none}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
  .cal .wd{font-size:11px;color:var(--muted);padding:6px 0}
  .cal .dy{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:14px;border-radius:16px}
  .cal .dy.on{background:var(--green);color:#fff;font-weight:700}
  .evt{display:flex;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
  .evt .etm{font-size:14px;color:var(--green);font-weight:800;width:50px;flex:none}
  .photo-ai{position:relative;border-radius:var(--r);overflow:hidden;height:180px;background:radial-gradient(circle at 30% 35%,#E7C25A 0 14%,transparent 15%),radial-gradient(circle at 65% 55%,#D8A23F 0 12%,transparent 13%),radial-gradient(circle at 45% 75%,#C68A2E 0 11%,transparent 12%),linear-gradient(135deg,#D6A646,#AE7726)}
  .ai-lab{position:absolute;background:rgba(30,38,24,.74);color:#fff;font-size:11px;font-weight:600;padding:3px 8px;border-radius:7px}
  .logout{width:100%;text-align:center;color:var(--red-tx);font-weight:700;padding:15px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-top:14px}

  .hf-head{margin:2px 2px 12px}
  .hf-head .loc{font-size:13px;color:var(--muted);font-weight:600}
  .hf-head .dt{font-size:13px;color:var(--muted)}
  .hf-big{border-radius:var(--r);padding:22px;margin-bottom:4px;border:1px solid transparent}
  .hf-big.strong{background:var(--green-tint)}
  .hf-big.mod{background:var(--amber-tint)}
  .hf-big.dearth{background:var(--red-tint)}
  .hf-status{display:flex;align-items:center;gap:10px;font-size:23px;font-weight:800}
  .hf-big.strong .hf-status{color:var(--green-tx)} .hf-big.mod .hf-status{color:var(--amber-tx)} .hf-big.dearth .hf-status{color:var(--red-tx)}
  .hf-status .d{width:14px;height:14px;border-radius:999px;flex:none}
  .hf-big.strong .d{background:#4E9A4E} .hf-big.mod .d{background:var(--gold)} .hf-big.dearth .d{background:#D14A38}
  .hf-note{font-size:13px;color:var(--muted);margin-top:16px}
  .hf-days{font-size:42px;font-weight:800;color:var(--text);margin-top:4px;line-height:1}
  .hf-days span{font-size:18px;font-weight:600;color:var(--muted)}
  .hf-bar{display:flex;align-items:center;gap:12px;margin-bottom:11px}
  .hf-bar .bl{font-size:13px;color:var(--muted);width:78px;flex:none}
  .hf-bar .bt{flex:1;height:14px;background:var(--soft);border-radius:999px;overflow:hidden}
  .hf-bar .bf{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--green-hi),var(--green))}
  .advice{background:var(--green-tint);border-radius:var(--r);padding:4px 16px}
  .advice .a{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid rgba(94,115,80,.16);font-size:15px;font-weight:600;color:var(--green-deep)}
  .advice .a:last-child{border-bottom:none}
  .advice .a .c{color:var(--green);flex:none}
  .ai-badge{display:inline-flex;align-items:center;gap:5px;background:var(--green);color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
  .stars{color:var(--gold);font-size:15px;letter-spacing:1px}
  .stars .e{color:#D9D6C8}
  .nimg{height:148px;border-radius:var(--r);background:radial-gradient(circle at 28% 38%,#fff 0 7%,transparent 8%),radial-gradient(circle at 62% 30%,#fff 0 6%,transparent 7%),radial-gradient(circle at 78% 62%,#fff 0 6%,transparent 7%),radial-gradient(circle at 40% 70%,#fff 0 7%,transparent 8%),linear-gradient(160deg,#88A86E,#5E7350)}

  #toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(16px);background:#2F3B33;color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:80;display:flex;align-items:center;gap:8px}
  .modal-ov{position:fixed;inset:0;background:rgba(35,45,35,.45);display:flex;align-items:center;justify-content:center;z-index:90;padding:26px;animation:f .18s ease}
  .modal{background:var(--card);border-radius:var(--r);padding:24px 22px;max-width:360px;width:100%;text-align:center;box-shadow:0 18px 50px rgba(30,40,25,.3)}
  .modal .micon{width:62px;height:62px;border-radius:999px;background:var(--amber-tint);color:var(--gold);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
  .modal .mt{font-size:19px;font-weight:800}

V.hives=function(){
  var ah=allHives();
  var rows=ah.length?ah.map(function(x){
    var h=x.h, ph=h.photo;
    var avatar='<span style="width:42px;height:42px;display:flex;align-items:center;justify-content:center;flex:none">'+hiveIcon(hiveColor(h.id))+'</span>';
    return '<button class="item" data-act="hive" data-ai="'+x.ai+'" data-hk="'+x.hk+'">'+avatar+
      '<span style="flex:1"><div class="t" style="font-size:16px">Hive '+h.id+'</div><div class="s" style="margin-top:1px">'+x.an+'</div></span>'+
      '<span class="tag '+h.st+'">'+TAGTX[h.st]+'</span>'+ic('cright',18,2)+'</button>';
  }).join(''):'<div style="text-align:center;color:var(--muted);padding:36px 0">No hives yet</div>';
  return statusbar()+topbar('Hives','<button class="ib" data-act="addhive">'+ic('plus',23)+'</button>')+
  '<div class="body">'+
    '<div class="search">'+ic('search',17)+'Search hives</div>'+
    '<div class="list">'+rows+'</div>'+
    (S.pro
      ? '<button class="add-btn" data-act="addhive" style="margin-top:6px">'+ic('plus',20)+'Add Hive</button>'
      : '<div style="text-align:center;margin-top:16px;color:var(--muted);font-size:13px">Free plan · '+ah.length+' of 3 hives used</div>'+
        (ah.length<3
         ? '<button class="add-btn" data-act="addhive" style="margin-top:10px">'+ic('plus',20)+'Add Hive</button>'
         : '<button class="add-btn" data-act="addhive" style="margin-top:10px">'+ic('star',19)+'Upgrade for unlimited hives</button>'))+
  '</div>'+tabbar();
};

V.hiveDetail=function(){
  var c=S.curHive||{ai:0,hk:0};
  var ap=S.apiaries[c.ai]||S.apiaries[0];
  var h=(ap&&ap.hl&&ap.hl[c.hk])?ap.hl[c.hk]:(ap&&ap.hl?ap.hl[0]:null);
  if(!h)h={id:'#1',loc:'',st:'ok'};
  var ph=h.photo;
  var lastRec=(S.records||[]).filter(function(rr){return rr.hid===h.id;})[0];
  var heroStyle='margin-top:2px'+(ph?';background:linear-gradient(rgba(40,55,35,.45),rgba(40,55,35,.55)),url('+ph+') center/cover':'');
  return statusbar()+topbar('Hive '+h.id,'<button class="ib" data-act="toast" data-msg="Edit">'+ic('pencil',20)+'</button><button class="ib" data-act="toast" data-msg="More">'+ic('dots',20)+'</button>')+
  '<div class="body">'+
    '<div class="hero" style="'+heroStyle+'"><div class="info"><div class="nm" style="font-size:24px">Hive '+h.id+'</div><div class="sub">'+(ap?ap.n:'')+'</div></div>'+'<img class="hero-photo" alt="" src="'+HIVEPHOTO+'">'+'</div>'+
    '<div class="sec" style="margin-bottom:9px"><span class="h" style="font-size:15px">Health Status</span></div>'+
    '<div class="health"><div><span class="tag '+h.st+'">'+TAGTX[h.st]+'</span><div style="font-size:13px;color:var(--muted);margin-top:10px">'+(h.st==='ok'?'All good, keep it up!':h.st==='mid'?'Keep an eye on this one.':'Needs attention soon.')+'</div></div>'+ring(h.st==='ok'?85:h.st==='mid'?62:38)+'</div>'+
    '<div style="margin-top:8px">'+
      '<div class="inforow"><span class="k">Type</span><span class="v">'+(h.type||'Langstroth 10-frame')+'</span></div>'+
      '<div class="inforow"><span class="k">Frames</span><span class="v">'+((h.frames!=null)?h.frames:10)+'</span></div>'+
      '<div class="inforow"><span class="k">Last inspection</span><span class="v">'+(lastRec?lastRec.date:'\u2014')+'</span></div>'+
    '</div>'+
    '<div style="height:18px"></div>'+
    '<button class="gbtn" data-act="inspect">'+ic('clipck',21)+'Start Inspection</button>'+
    '<div style="height:11px"></div>'+
    '<button class="obtn" data-act="go" data-to="records">'+ic('clock',19)+'View History</button>'+
  '</div>'+tabbar();
};

V.inspect=function(){
  var step=STEPS[S.step-1], n=S.step;
  var stepperHtml='<div class="stepper">';
  for(var i=1;i<=5;i++){
    var on=i<=n;
    stepperHtml+='<span class="node'+(on?' on':'')+'">'+(i<n?ic('check',9,3):'')+'</span>';
    if(i<5)stepperHtml+='<span class="seg'+(i<n?' on':'')+'"></span>';
  }
  stepperHtml+='</div>';
  var bodyHtml;
  if(step.notes){
    bodyHtml='<div class="wz-title">Step 5: Notes &amp; Photos</div><div class="wz-q">Add notes and photos</div>'+
      '<button class="obtn" data-act="toast" data-msg="Start voice note" style="justify-content:flex-start;gap:11px;padding:15px"><span style="width:34px;height:34px;border-radius:999px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center">'+ic('mic',19)+'</span><span style="font-weight:700;color:var(--green-deep)">Voice note</span><span style="margin-left:auto;color:var(--muted);font-size:12px">Tap to speak</span></button>'+
      '<div style="height:12px"></div>'+
      '<textarea class="ta" data-field="insp-note" placeholder="Add notes\u2026">'+(S.insp.note||'')+'</textarea>'+
      '<div class="photo-add"><button class="pbtn" data-act="toast" data-msg="Take photo">'+ic('camera',22)+'Photo</button><button class="pbtn" data-act="toast" data-msg="Choose from gallery">'+ic('plus',22)+'Gallery</button></div>';
  } else {
    bodyHtml='<div class="wz-title">Step '+n+': '+step.t+'</div><div class="wz-q">'+step.q+'</div>'+
      step.opts.map(function(o){
        var on=S.insp[step.k]===o[0];
        return '<button class="optcard'+(on?' on':'')+'" data-act="pick" data-k="'+step.k+'" data-v="'+o[0]+'"><span class="radio">'+(on?ic('check',16,3):'')+'</span><span class="ol">'+o[0]+'</span><span class="oi">'+optIcon(o[1])+'</span></button>';
      }).join('');

  if(!f)return;
  if(f==='eq-name'){var ec=e.target.getAttribute('data-cat'),ei=+e.target.getAttribute('data-i');if(S.equipment[ec]&&S.equipment[ec][ei])S.equipment[ec][ei].n=e.target.value;}
  else if(f==='hv-loc'){var aph=S.apiaries[S.curApiary];var hkk=+e.target.getAttribute('data-hk');if(aph&&aph.hl[hkk])aph.hl[hkk].loc=e.target.value;}
  else if(f==='insp-note'){S.insp.note=e.target.value;}
  else {var ap=S.apiaries[S.curApiary]; if(!ap)return; if(f==='ap-name')ap.n=e.target.value; else if(f==='ap-loc')ap.d=e.target.value;}
  clearTimeout(saveTimer);saveTimer=setTimeout(persist,400);
});
app.addEventListener('change',function(e){
  var f=e.target.getAttribute&&e.target.getAttribute('data-field');
  if(f==='hv-type'){var ap=S.apiaries[S.curApiary];var hk=+e.target.getAttribute('data-hk');if(ap&&ap.hl[hk]){ap.hl[hk].type=e.target.value;render();}}
});
loadState();
render();
</script>
</body>
</html>
