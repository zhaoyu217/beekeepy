apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
android {
    namespace = 'app.hivefield.mobile'
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId 'app.hivefield.mobile.recoveryqa'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName '0.1.0-recoveryqa'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_21; targetCompatibility JavaVersion.VERSION_21 }
    kotlinOptions { jvmTarget = '21' }
    androidResources { noCompress += ['onnx','txt','vocab','wav'] }
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }
}
dependencies {
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Pinned AAR must be externally provided with exact SHA256 before any APK build.
    implementation files('libs/sherpa-onnx-1.13.8.aar')
}
