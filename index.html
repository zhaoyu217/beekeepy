  <script>
  (function(){
    if(window.__HD_INLINE_VOICE_ENTRY_V310__)return;
    window.__HD_INLINE_VOICE_ENTRY_V310__=true;

    function openVoice(){
      if(typeof window.openStructuredVoiceInspection==='function'){
        window.openStructuredVoiceInspection();
        return;
      }
      try{window.__HD_STRUCTURED_VOICE_V1__=false;}catch(_){}
      var old=document.querySelector('script[data-hd-inline-voice-retry="310"]');
      if(old)return;
      var s=document.createElement('script');
      s.src='inspection-voice.js?v=voice-inspection-v310-inline-retry';
      s.dataset.hdInlineVoiceRetry='310';
      s.onload=function(){
        if(typeof window.openStructuredVoiceInspection==='function')window.openStructuredVoiceInspection();
        else if(typeof window.toast==='function')window.toast('Voice module did not initialize');
      };
      s.onerror=function(){if(typeof window.toast==='function')window.toast('Voice module could not be loaded');};
      document.head.appendChild(s);
    }

    function textOf(el){return String(el&&el.textContent||'').replace(/\s+/g,' ').trim();}
    function isNotesLabel(el){return /^Notes:?$/i.test(textOf(el));}

    function findNotesHost(root){
      if(!root)return null;

      var area=document.getElementById('inotes');
      if(area){
        var legacy=area.closest('.v211-notes,.notes,.formgroup,.inspection-field-row');
        if(legacy)return legacy;
        if(area.parentElement)return area.parentElement;
      }

      var known=root.querySelector('.v211-notes,.notes');
      if(known)return known;

      var rows=root.querySelectorAll('.inspection-field-row,.v211-field-row,.field-row,.formgroup,.setting,section,div');
      for(var i=0;i<rows.length;i++){
        var row=rows[i];
        var children=Array.from(row.children||[]);
        if(children.some(isNotesLabel))return row;
      }

      var labels=root.querySelectorAll('span,label,b,div');
      for(var j=0;j<labels.length;j++){
        if(!isNotesLabel(labels[j]))continue;
        var host=labels[j].closest('.inspection-field-row,.v211-field-row,.field-row,.formgroup,.setting,section,div');
        if(host&&root.contains(host))return host;
      }
      return null;
    }

    function ensure(){
      if(!/^#inspection(?:\/|$)/i.test(String(location.hash||'')))return;
      var root=document.getElementById('view')||document;

      root.querySelectorAll('.voice-row').forEach(function(x){
        x.hidden=true;
        x.setAttribute('aria-hidden','true');
        x.style.setProperty('display','none','important');
      });

      if(root.querySelector('.hd-inline-speak,.hd-notes-mic'))return;

      var notes=findNotesHost(root);
      if(!notes)return;

      notes.classList.add('hd-voice-anchor-host');
      var btn=document.createElement('button');
      btn.type='button';
      btn.className='hd-inline-speak';
      btn.setAttribute('aria-label','Speak inspection');
      btn.innerHTML='🎙 <span>Speak</span>';
      btn.addEventListener('click',function(e){
        e.preventDefault();
        e.stopPropagation();
        openVoice();
      });
      notes.appendChild(btn);
    }

    function schedule(){
      ensure();
      setTimeout(ensure,0);
      setTimeout(ensure,100);
      setTimeout(ensure,400);
      setTimeout(ensure,1000);
    }

    schedule();
    window.addEventListener('hashchange',schedule);
    var view=document.getElementById('view');
    if(view&&typeof MutationObserver==='function'){
      new MutationObserver(function(){ensure();}).observe(view,{childList:true,subtree:true});
    }
    setInterval(ensure,1000);
  })();
  </script>

      var b=document.getElementById('hd-voice-diag-v313');
      if(!b){
        b=document.createElement('button');b.id='hd-voice-diag-v313';b.type='button';
        b.textContent='🎙 Speak';b.setAttribute('aria-label','Speak inspection');
        b.onclick=function(e){e.preventDefault();e.stopPropagation();openVoice();};
        document.body.appendChild(b);
      }
      b.classList.toggle('hd-show',inspectionPresent());
    }
    function schedule(){ensure();setTimeout(ensure,50);setTimeout(ensure,300);setTimeout(ensure,1000);}
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',schedule);else schedule();
    window.addEventListener('hashchange',schedule);
    new MutationObserver(ensure).observe(document.documentElement,{childList:true,subtree:true});
